name: ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core shellcheck
      - uses: astral-sh/setup-uv@v5
      - name: lint
        run: make lint
      - name: smoke
        run: make test
