name: ci
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core shellcheck
      - uses: astral-sh/setup-uv@v5
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh exemplos/video-docs/*.sh
      - name: ruff
        run: uvx ruff check scripts skills/video-docs/scripts tests
      - name: smoke
        run: bash tests/smoke.sh
      - name: video-docs offline (stub de edge-tts)
        run: bash tests/docs_offline.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg shellcheck && brew install --cask font-dejavu
      - name: usar o ffmpeg do Homebrew e diagnosticar libass
        run: |
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"
          which -a ffmpeg
          ffmpeg -hide_banner -version | head -3
          ffmpeg -hide_banner -buildconf | grep -i -E "libass|libfreetype|libfontconfig" || echo "buildconf sem libass"
          ffmpeg -hide_banner -filters | grep -iE "ass|subtitles" || echo "sem filtros ass/subtitles"
          brew info ffmpeg | head -5
      - uses: astral-sh/setup-uv@v5
      - name: smoke
        run: bash tests/smoke.sh
      - name: video-docs offline (stub de edge-tts)
        run: bash tests/docs_offline.sh
