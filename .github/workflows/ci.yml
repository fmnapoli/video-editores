name: ci
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core shellcheck
      - uses: astral-sh/setup-uv@v5
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh exemplos/video-docs/*.sh
      - name: ruff
        run: uvx ruff check scripts skills/video-docs/scripts tests
      - name: smoke
        run: bash tests/smoke.sh
      - name: video-docs offline (stub de edge-tts)
        run: bash tests/docs_offline.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg-full shellcheck && brew install --cask font-dejavu
      - name: usar o ffmpeg-full (a fórmula ffmpeg do Homebrew vem sem libass desde a v8)
        run: |
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix ffmpeg-full)/bin/ffmpeg" -hide_banner -filters | grep -E ' (ass|subtitles) '
      - uses: astral-sh/setup-uv@v5
      - name: smoke
        run: bash tests/smoke.sh
      - name: video-docs offline (stub de edge-tts)
        run: bash tests/docs_offline.sh
