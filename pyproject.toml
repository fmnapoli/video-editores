[project]
name = "video-editores"
version = "0.6.0"
description = "Núcleo de edição de vídeo por IA local (transcrição, recorte de pessoa, montagem, legenda) com CLI e servidor MCP; usado pelas skills do plugin video-editores."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fabrizio Malta Di Napoli" }]
keywords = ["video", "ffmpeg", "whisper", "rembg", "mcp", "editing"]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.1", "numpy"]
seg = ["rembg>=2.0", "onnxruntime", "pillow", "numpy"]
seg-gpu = ["rembg>=2.0", "onnxruntime-gpu", "pillow", "numpy"]
tts = ["edge-tts>=6"]
mcp = ["mcp>=2.0"]
todos = ["faster-whisper>=1.1", "rembg>=2.0", "onnxruntime", "pillow", "numpy", "edge-tts>=6", "mcp>=2.0"]

[project.scripts]
video-editores = "video_editores.cli:main"
video-editores-mcp = "video_editores.mcp_server:main"

[project.urls]
Repository = "https://github.com/fmnapoli/video-editores"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_editores"]

# Os scripts e templates viajam dentro da roda, espelhando a árvore do repositório,
# para que os caminhos relativos entre eles (HERE/../..) continuem válidos.
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "video_editores/recursos/scripts"
"skills" = "video_editores/recursos/skills"
